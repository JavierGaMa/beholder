name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Beholder ${{ github.ref_name }}
          releaseBody: |
            ## Install (macOS)

            1. Download the DMG for your Mac:
               - **Apple Silicon (M1/M2/M3/M4)** → the file ending in `aarch64.dmg`
               - **Intel** → the file ending in `x64.dmg`
            2. Open the DMG and drag **Beholder** into **Applications**.
            3. First launch: the app is not notarized, so macOS blocks it.
               Right-click Beholder in Applications → **Open** → **Open**
               (on newer macOS: System Settings → Privacy & Security → **Open Anyway**).

            The `.tar.gz`, `.sig` and `latest.json` assets power the in-app
            auto-updater — Beholder updates itself, no need to download these.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
