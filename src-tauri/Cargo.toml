[package]
name = "beholder"
version = "0.1.0"
description = "Network traffic inspector for React Native apps on Android emulators"
authors = ["valinor"]
edition = "2021"

[lib]
name = "beholder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
bh-core = { workspace = true }
bh-ca = { workspace = true }
bh-device = { workspace = true }
bh-proxy = { workspace = true }
bh-console = { workspace = true }
bh-agent = { workspace = true }
tauri-plugin-dialog = "2.7.2"
toml = "1.1.4"
notify = "8.2.0"
thiserror.workspace = true

