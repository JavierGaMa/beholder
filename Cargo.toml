[workspace]
members = ["src-tauri", "crates/bh-core", "crates/bh-ca", "crates/bh-device", "crates/bh-proxy", "crates/bh-console", "crates/bh-agent", "crates/beholder-mcp"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
bh-core = { path = "crates/bh-core" }
bh-ca = { path = "crates/bh-ca" }
bh-device = { path = "crates/bh-device" }
bh-proxy = { path = "crates/bh-proxy" }
bh-console = { path = "crates/bh-console" }
bh-agent = { path = "crates/bh-agent" }
portable-pty = "0.8"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = { version = "0.3", default-features = false }
